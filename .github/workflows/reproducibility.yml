name: Reproducibility check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install analysis dependency
        run: Rscript requirements.R

      - name: Reproduce figures and result tables
        run: Rscript scripts/reproduce_analysis.R

      - name: Validate repository
        run: Rscript scripts/validate_repository.R
