<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical clustering analysis pipeline</title>
  <desc id="desc">Five connected steps: expression matrix, variance filter, standardisation, Ward clustering, and label audit.</desc>
  <rect width="1200" height="250" rx="24" fill="#F5F8FC"/>
  <path d="M214 125H260M454 125H500M694 125H740M934 125H980" stroke="#9CB4C8" stroke-width="4" stroke-linecap="round"/>
  <g fill="#9CB4C8">
    <path d="M254 117l13 8-13 8z"/><path d="M494 117l13 8-13 8z"/><path d="M734 117l13 8-13 8z"/><path d="M974 117l13 8-13 8z"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(30 35)">
      <rect width="184" height="180" rx="18" fill="#0F2841"/>
      <g transform="translate(31 26)">
        <rect width="8" height="13" fill="#2DD4BF"/><rect x="14" width="8" height="13" fill="#FFCA65"/><rect x="28" width="8" height="13" fill="#4EA5FF"/><rect x="42" width="8" height="13" fill="#FF6577"/>
        <rect y="19" width="8" height="13" fill="#4EA5FF"/><rect x="14" y="19" width="8" height="13" fill="#2DD4BF"/><rect x="28" y="19" width="8" height="13" fill="#FF6577"/><rect x="42" y="19" width="8" height="13" fill="#FFCA65"/>
      </g>
      <text x="28" y="100" fill="#FFFFFF" font-size="20" font-weight="700">Expression data</text>
      <text x="28" y="130" fill="#B8D0E2" font-size="15">38 × 7,129</text>
      <text x="28" y="154" fill="#B8D0E2" font-size="15">sample signals</text>
    </g>
    <g transform="translate(270 35)">
      <rect width="184" height="180" rx="18" fill="#E6F8F5" stroke="#BCE9E2"/>
      <path d="M30 68h18V37h18v16h18V23h18v45h18V46h18v22" fill="none" stroke="#14A892" stroke-width="6"/>
      <text x="28" y="100" fill="#12344D" font-size="20" font-weight="700">Variance filter</text>
      <text x="28" y="130" fill="#46677E" font-size="15">keep the top 100</text>
      <text x="28" y="154" fill="#46677E" font-size="15">most variable genes</text>
    </g>
    <g transform="translate(510 35)">
      <rect width="184" height="180" rx="18" fill="#EDF4FE" stroke="#C8DBF3"/>
      <path d="M32 66h122M44 46c22 0 26-25 50-25s28 43 58 43" fill="none" stroke="#347FD4" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="100" fill="#12344D" font-size="20" font-weight="700">Standardise</text>
      <text x="28" y="130" fill="#46677E" font-size="15">comparable scales</text>
      <text x="28" y="154" fill="#46677E" font-size="15">across selected genes</text>
    </g>
    <g transform="translate(750 35)">
      <rect width="184" height="180" rx="18" fill="#F3EEFD" stroke="#DACCF4"/>
      <path d="M38 67V48h28V31h35V16M66 48h25v28M101 31h34v18h18v28" fill="none" stroke="#7B61C9" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="100" fill="#12344D" font-size="20" font-weight="700">Build the tree</text>
      <text x="28" y="130" fill="#46677E" font-size="15">Euclidean distance</text>
      <text x="28" y="154" fill="#46677E" font-size="15">+ Ward.D2 linkage</text>
    </g>
    <g transform="translate(990 35)">
      <rect width="180" height="180" rx="18" fill="#FFF0F2" stroke="#F5CBD1"/>
      <circle cx="48" cy="52" r="20" fill="#4EA5FF"/><circle cx="92" cy="52" r="20" fill="#FF6577"/>
      <text x="28" y="100" fill="#12344D" font-size="20" font-weight="700">Audit labels</text>
      <text x="28" y="130" fill="#46677E" font-size="15">interpret only after</text>
      <text x="28" y="154" fill="#46677E" font-size="15">unsupervised fitting</text>
    </g>
  </g>
</svg>
